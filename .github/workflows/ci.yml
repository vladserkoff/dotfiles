name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Every chezmoi call needs this: `init --source` does not persist the source
  # directory, and CHEZMOI_SOURCE_DIR is not read as config. Without it chezmoi
  # finds no source dir and every check passes vacuously.
  CHEZMOI_ARGS: -S ${{ github.workspace }}

jobs:
  render:
    name: render (${{ matrix.os }}, is_work=${{ matrix.is_work }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        is_work: [true, false]
    steps:
      - uses: actions/checkout@v5

      - name: Install chezmoi
        run: |
          sh -c "$(curl -fsSL https://get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Initialise with non-interactive prompt answers
        # --promptString/--promptBool are keyed by the *prompt text* in
        # .chezmoi.toml.tmpl, not by the data key.
        run: |
          chezmoi $CHEZMOI_ARGS init \
            --promptString "E-mail=ci@example.com" \
            --promptString "Default AWS profile:=" \
            --promptBool "Is it a work machine?=${{ matrix.is_work }}"

      - name: Verify the source dir was actually found
        run: |
          count=$(chezmoi $CHEZMOI_ARGS managed | wc -l)
          echo "managed targets: $count"
          [ "$count" -gt 0 ] || { echo "::error::no managed targets - source dir not picked up"; exit 1; }

      - name: Verify every target renders and applies cleanly
        run: chezmoi $CHEZMOI_ARGS apply --dry-run --verbose

      - name: Verify the generated Brewfile parses and is correctly tiered
        if: runner.os == 'macOS'
        run: |
          chezmoi $CHEZMOI_ARGS cat "$HOME/.Brewfile" > /tmp/Brewfile
          cat /tmp/Brewfile
          # `brew bundle` runs Homebrew's diagnostics, which may warn about
          # untrusted taps already present on the runner image (e.g. aws/tap).
          # That is runner state, not this repo's config, and is not silenced
          # here: HOMEBREW_NO_REQUIRE_TAP_TRUST=1 is the only lever and
          # Homebrew explicitly discourages it.
          brew bundle list --file=/tmp/Brewfile >/dev/null
          # Every non-official tap a formula comes from must be declared, or
          # Homebrew will silently ignore it on a fresh machine.
          grep -o '^brew "[^/"]*/[^/"]*/' /tmp/Brewfile | sed 's/^brew "//;s|/$||' | sort -u \
            | while read -r t; do
                grep -q "^tap \"$t\"" /tmp/Brewfile || { echo "::error::formula from undeclared tap $t"; exit 1; }
              done
          if [ "${{ matrix.is_work }}" = "true" ]; then
            grep -q csvlens /tmp/Brewfile || { echo "::error::work package missing"; exit 1; }
            ! grep -q transmission /tmp/Brewfile || { echo "::error::personal package leaked into work"; exit 1; }
          else
            grep -q transmission /tmp/Brewfile || { echo "::error::personal package missing"; exit 1; }
            ! grep -q csvlens /tmp/Brewfile || { echo "::error::work package leaked into personal"; exit 1; }
          fi

  lint:
    name: shellcheck (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Both OSes: scripts guarded on the other OS render empty, so each runner
      # only ever lints its own half.
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install chezmoi and shellcheck
        run: |
          sh -c "$(curl -fsSL https://get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          command -v shellcheck >/dev/null || brew install shellcheck

      - name: Render scripts and lint them
        run: |
          chezmoi $CHEZMOI_ARGS init \
            --promptString "E-mail=ci@example.com" \
            --promptString "Default AWS profile:=" \
            --promptBool "Is it a work machine?=false"
          mkdir -p /tmp/rendered
          for f in .chezmoiscripts/*.tmpl; do
            out="/tmp/rendered/$(basename "${f%.tmpl}")"
            chezmoi $CHEZMOI_ARGS execute-template < "$f" > "$out"
            # Guarded on a non-matching OS: renders empty, nothing to lint.
            [ -s "$out" ] || rm -f "$out"
          done
          echo "linting: $(ls /tmp/rendered)"
          shellcheck --severity=warning /tmp/rendered/* scripts/setup
